name: Release

# Changesets (https://github.com/changesets/changesets) drive this end to end.
#
#   push to main with pending changesets  ->  the Version PR is created/updated
#                                             (see version-pr.yml)
#   merge the Version PR                  ->  this workflow stages that version
#
# Staging means the tarball lands in npm's staging area and is NOT live until a
# human approves it (`npm stage approve`, or the npmjs staged-packages UI). The
# trusted publisher is therefore restricted to stage-publish only, and no npm
# token exists anywhere: authentication is GitHub OIDC, and only the publish job
# can mint one.
#
# One-time setup lives in RELEASING.md.
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'CHANGELOG.md'
      - '.changeset/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  plan:
    name: Read the changesets publish plan
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      dist_tag: ${{ steps.plan.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.24.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # `changeset publish-plan` is the official answer to "what is ready to
      # publish or tag?" - it respects whether the Version PR was merged, and it
      # reports the dist-tag to use (prereleases included).
      - name: Read the plan
        id: plan
        run: |
          set -euo pipefail
          pnpm exec changeset publish-plan --output "${RUNNER_TEMP}/plan.json" 2>&1 | tail -5

          ENTRY=$(jq -r '[.plan[][] | select(.kind == "publish")][0] // empty' "${RUNNER_TEMP}/plan.json")
          if [ -z "$ENTRY" ]; then
            echo "Nothing to publish from this commit."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(echo "$ENTRY" | jq -r '.version')
            DIST_TAG=$(echo "$ENTRY" | jq -r '.tag // "latest"')
            echo "Ready to stage watch-tail@${VERSION} (dist-tag: ${DIST_TAG})"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "## Changesets publish plan"
            echo
            jq -r '.plan[] | map("- \(.kind) \(.name)@\(.version) (tag: \(.tag // "latest"))") | .[]' "${RUNNER_TEMP}/plan.json" 2>/dev/null || echo "- (empty)"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify the released commit
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.24.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm lint
      - run: pnpm exec oxfmt --check .
      - run: pnpm knip
      # Metadata is validated before the publish job, which never builds or
      # tests: publishing runs nobody's code, and nobody's code runs with the
      # OIDC token.
      - name: Validate package metadata (publint)
        run: pnpm exec publint

  publish:
    name: Stage to npm
    needs: [plan, verify]
    # `NPM_PUBLISH_ENABLED` is a repository variable (Settings → Secrets and
    # variables → Actions → Variables) that is set to `true` once the npm trusted
    # publisher for this workflow exists. Until then the workflow verifies the
    # release commit and stops here instead of failing on an npm call it is not
    # yet allowed to make. See RELEASING.md.
    if: needs.plan.outputs.publish == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: publish
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.24.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for the `npm stage` command
        # Node 24's bundled npm does OIDC trusted publishing but predates staged
        # publishing.
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Pack from the changesets plan
        # `changeset pack` reads the same plan and runs each package's `prepack`
        # (which builds the app and the CLI into the tarball).
        run: |
          set -euo pipefail
          pnpm exec changeset publish-plan --output "${RUNNER_TEMP}/plan.json"
          pnpm exec changeset pack --from-publish-plan "${RUNNER_TEMP}/plan.json" \
            --out-dir "${RUNNER_TEMP}/packed"
          find "${RUNNER_TEMP}/packed" -name '*.tgz' -print
      - name: Stage
        env:
          DIST_TAG: ${{ needs.plan.outputs.dist_tag }}
        run: |
          set -euo pipefail
          # Auth is GitHub OIDC trusted publishing (id-token: write plus
          # registry-url); --provenance attests the build to this commit.
          for tarball in $(find "${RUNNER_TEMP}/packed" -name '*.tgz'); do
            echo "Staging ${tarball}"
            npm stage publish --provenance --access public --ignore-scripts \
              --tag "${DIST_TAG}" "${tarball}" 2>&1 | tee -a "${RUNNER_TEMP}/staged.log"
          done
      - name: Summarise
        run: |
          set -euo pipefail
          {
            echo "## Staged package"
            echo
            grep 'staged with id' "${RUNNER_TEMP}/staged.log" || echo "No staging id reported."
            echo
            echo 'Not live yet: approve with `npm stage approve` or the npmjs staged-packages UI.'
          } >> "$GITHUB_STEP_SUMMARY"

  tag:
    name: Tag the release
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.24.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create the tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # `changeset git-tag` writes the canonical tag for the current version
          # (v0.1.0 for a single package), so the tag always matches what was
          # staged.
          pnpm exec changeset git-tag
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            --notes "Staged to npm by the release workflow. Approve the staged package to make it live:
          https://www.npmjs.com/settings/~/staged-packages"
